# ===========================================================================
# lefthook.yml — конфиг git-хуков.
#
# Зачем: гит-хуки (файлы в .git/hooks) НЕ версионируются — у каждого
# разработчика их надо ставить руками, и они непременно разъедутся.
# lefthook решает это: конфиг лежит В РЕПОЗИТОРИИ (этот файл), а `lefthook
# install` один раз прописывает тонкие обёртки в .git/hooks, которые зовут
# его. Пропустил установку — хуки просто не работают; конфиг же видят все.
#
# Правило разделения труда (важно!):
#   pre-commit — БЫСТРЫЕ проверки: gofmt, линтер, юнит-тесты. Всё, что
#                не требует окружения. Коммит должен проходить за секунды,
#                иначе разработчик начнёт делать --no-verify — и хуки станут
#                бесполезными декорациями.
#   CI (GitHub Actions) — ПОЛНЫЙ прогон: интеграционные тесты с живой БД,
#                сборка докера. Дорогое окружение доступно только там.
# ===========================================================================

pre-commit:
  # parallel — команды гоняются ОДНОВРЕМЕННО (в разных процессах), а не
  # друг за другом. fmt/lint/test независимы — экономим время.
  parallel: true

  commands:
    # --- gofmt: авто-форматирование захваченных (staged) .go-файлов ---
    # {staged_files} — плейсхолдер lefthook: список файлов в индексе.
    # Форматируем ТОЛЬКО их, а не весь репозиторий: иначе коммит с одной
    # правкой "случайно" переформатирует чужие файлы и замусорит diff.
    # glob — фильтр: команда имеет смысл только для Go-файлов.
    # stage_fixed — lefthook сам сделает git add изменённых файлов: правка
    # попадёт в текущий коммит, а не зависнет в рабочей директории.
    #
    # Это ЕДИНСТВЕННАЯ команда здесь НЕ через make: make fmt форматирует
    # всё дерево (./cmd ./internal), а хуку нужна git-специфика — staged
    # файлы. Логика staging area — территория конфига хуков, не сборки.
    fmt:
      glob: "*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    # --- lint и test — через make ---
    # Принцип "один источник правды": правила lint и состав тестов описаны
    # в Makefile ОДИН раз, и хук, и будущий CI зовут одни и те же таргеты.
    # Изменишь флаги в Makefile — хук и CI подхватят автоматически.
    # (Дублирование команды здесь = два места, которые разъедутся со временем.)

    lint:
      run: make lint

    test:
      run: make test

    # --- docs: перегенерация Swagger при каждом коммите с Go-кодом ---
    # Дока едет в ОДНОМ коммите с кодом — это атомарность: откат коммита
    # откатывает и код, и документацию вместе (с раздельными коммитами
    # начался бы пинг-понг "откатил код — дока осталась от кода").
    # glob "*.go" — регенерим только если в коммите есть Go-код: аннотации
    # Swagger живут только в .go, README/Makefile доку изменить не могут.
    #
    # Нюанс, о котором стоит знать: swag сканирует РАБОЧУЮ директорию, а не
    # индекс. Если аннотация отредактирована, но не staged — в доку попадёт
    # и неоткоммиченное. Практический вывод: коммить полный набор изменений.
    #
    # `git add docs` — вручную долетаживаем результат: stage_fixed тут не
    # подходит, он перевешивает СТЭЙДЖ-файлы, а docs/ в них не входили.
    # Если дока не изменилась — add безвреден, коммит не растёт.
    docs:
      glob: "*.go"
      run: go tool swag init -g cmd/api/main.go -o docs --parseInternal --parseDependency --useStructName && git add docs