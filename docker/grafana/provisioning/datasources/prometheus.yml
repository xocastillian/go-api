# ===========================================================================
# Провижининг датасорса Grafana.
#
# "Провижининг" — файлы, которые Grafana читает при старте и разворачивает
# сама. Без них датасорс пришлось бы добавлять руками через веб-интерфейс
# на каждой новой машине. Конфигурация как код — та же идея, что и миграции
# БД: описали в репо, поднялось само, у всех одинаково.
# ===========================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    # uid фиксированный: дашборды ссылаются на датасорс по uid
    # (в api-red.json: "uid": "prometheus"). Стабильный uid = дашборд
    # переживает пересоздание датасорса.
    uid: prometheus
    type: prometheus
    access: proxy
    # Внутри docker-сети: по имени сервиса, как в prometheus.yml.
    url: http://prometheus:9090
    isDefault: true