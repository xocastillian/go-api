# ===========================================================================
# prometheus.yml — конфиг скрейпа (сбор метрик).
#
# Вся работа Prometheus описывается здесь: КУДА ходить за метриками и как
# часто. В проде вместо static_configs пишут service discovery (k8s, Consul),
# чтобы список целей менялся сам; в dev-стеке честный статический список.
# ===========================================================================
global:
  # Как часто ходить за метриками. Компромисс: чаще = детальнее графики,
  # но больше нагрузки и хранилища. 5s для dev — норм; в проде обычно 15-30s.
  scrape_interval: 5s

scrape_configs:
  # Имя джобы попадает в каждую метрику лейблом job="api" — если скрейпим
  # несколько сервисов, по нему различаем источники.
  - job_name: api
    metrics_path: /metrics
    # Таргет — ИМЯ СЕРВИСА docker-compose ("api"), а не localhost: внутри
    # docker-сети localhost у Prometheus — это он сам. Имя сервиса резолвится
    # докер-DNS'ом, порт — ВНУТРЕННИЙ (8080), не хост-проброс.
    static_configs:
      - targets: ["api:8080"]

  # Postgres-метрики (через postgres-exporter, см. docker-compose.yml).
  # Здесь появились бы метрики pg_stat_*: коннекты, транзакции/сек,
  # cache hit ratio, активные сессии — то, что смотрят под нагрузкой.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]