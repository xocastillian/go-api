services:
  db:
    image: postgres:17-alpine
    container_name: notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Собираем образ из Dockerfile в корне проекта.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes_api
    restart: unless-stopped

    # env_file прокидывает в контейнер ВСЁ из .env: JWT_SECRET, TTL, CORS и т.д.
    # Тот же файл, из которого приложение читает конфиг локально — конфигурация одна.
    env_file: .env

    # environment ПЕРЕОПРЕДЕЛЯЕТ отдельные переменные (приоритет ВЫШЕ env_file).
    # Здесь только то, что обязано отличаться ВНУТРИ docker-сети:
    #   POSTGRES_HOST: db    — по имени сервиса, а не localhost. localhost внутри
    #                          контейнера api — это сам api, а не база!
    #   POSTGRES_PORT: 5432  — контейнер db слушает 5432; наружу проброшен другой
    #                          порт (${POSTGRES_PORT}), но внутри сети это неважно.
    #   APP_PORT: 8080       — фиксируем порт внутри контейнера (см. ports ниже).
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_PORT: 8080

    # Хост-порт берём из APP_PORT (.env, по умолчанию 8080); внутри — 8080.
    ports:
      - "${APP_PORT:-8080}:8080"

    # Стартуем ТОЛЬКО когда БД пройдёт healthcheck: миграции на старте
    # (entrypoint.sh) не должны бежать по ещё не поднявшейся базе.
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # Prometheus — хранилище метрик. Раз в scrape_interval (5s) сам ходит на
  # api:8080/metrics (pull) и складывает числа в свою временную БД.
  # Веб-интерфейс: http://localhost:9090 (проверить таргеты: Status -> Targets).
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: notes_prometheus
    restart: unless-stopped
    volumes:
      # Конфиг скрейпа: куда ходить. Монтируем read-only — Prometheus должен
      # читать его, а менять (из контейнера) не имеет права.
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Данные (временные ряды) переживают пересоздание контейнера.
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # =========================================================================
  # postgres_exporter — мост Postgres -> Prometheus. Сам опрашивает
  # системные вьюхи БД (pg_stat_database, pg_stat_activity, ...) и переводит
  # их в /metrics. После этого нагрузочный тест БД виден на графиках
  # Grafana (дашборд "Postgres Overview") в реальном времени.
  # =========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: notes_postgres_exporter
    restart: unless-stopped
    environment:
      # DSN на БД: по имени сервиса db, внутренний порт 5432 — та же
      # docker-сеть, что и у api. sslmode=disable — локальная сеть.
      DATA_SOURCE_NAME: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # Grafana — визуализация: подключается к Prometheus и рисует графики/
  # дашборды. Датасорс и дашборды провижинятся автоматически из docker/grafana
  # (см. provisioning). Веб-интерфейс: http://localhost:3001, логин admin/admin.
  # ⚠ admin/admin — ТОЛЬКО для локального dev: в проде пароль в секретах
  # и за балансером с авторизацией.
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: notes_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Провижининг: датасорс + список папок с дашбордами.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Сами JSON-дашборды.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Состояние Grafana (созданные руками дашборды, настройки) — в томе.
      - grafana_data:/var/lib/grafana
    ports:
      # 3001 наружу: 3000 оставлен типичному dev-фронтенду (см. CORS-дефолт).
      - "3001:3000"
    depends_on:
      - prometheus

  # =========================================================================
  # ELK-стек для логов (как на работе): Elasticsearch + Kibana + Filebeat.
  #
  #   api stdout -> Docker (json-файлы) -> Filebeat (агент) -> Elasticsearch
  #   Просмотр: Kibana http://localhost:5601 -> Discover.
  #
  # Логи — это НЕ метрики: Prometheus хранит ЧИСЛА (сколько, как быстро),
  # Elasticsearch хранит СТРОКИ (что именно написано) — поэтому отдельное
  # хранилище и отдельный интерфейс (Kibana, не Grafana).
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: notes_elasticsearch
    restart: unless-stopped
    environment:
      # Один узел без кластера: для dev этого достаточно; в проде — >=3 узлов.
      discovery.type: single-node
      # ⚠ СЕКЬЮРИТИ ВЫКЛЮЧЕН — только для dev: без логина/пароля и TLS.
      # В проде так нельзя: включить security, пароли в секреты, TLS.
      xpack.security.enabled: "false"
      # Куча JVM: 512MB — минимум для учебного стенда. По умолчанию ES берёт
      # ПОЛОВИНУ RAM машины — на ноуте это убийственно. Оперативка сверх кучи
      # уходит на дисковый кэш индексов, поэтому реальное потребление ~1GB.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"   # HTTP API (curl localhost:9200/_cat/indices — список индексов)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30      # ES стартует медленно (JVM) — терпим до ~5 минут
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: notes_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"   # веб-интерфейс
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30      # Kibana поднимается ещё дольше ES — норма
      start_period: 60s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    container_name: notes_filebeat
    restart: unless-stopped
    # Читает файлы контейнеров от имени root: права на docker.sock и логи
    # обычно есть только у него. Стандартная практика для beats.
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      # Конфиг шиппера: что читать и куда слать.
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # ГДЕ ЖИВУТ ЛОГИ КОНТЕЙНЕРОВ: Docker пишет stdout КАЖДОГО контейнера
      # в json-файл на диске. На Docker Desktop (mac/win) путь резолвится
      # ВНУТРИ её Linux-VM — для контейнера это работает одинаково.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker-сокет: filebeat спрашивает у Docker'а метаданные (имя контейнера,
      # образ) для каждого прочитанного файла. Read-only — только читать.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  es_data:
